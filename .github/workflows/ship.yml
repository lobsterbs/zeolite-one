name: ship
on:
  push:
    branches: ['ship-*']
    paths: ['.github/workflows/ship.yml']
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          rm -f assembled
          for f in $(ls pieces/*.b64 | sort); do base64 -d "$f" >> assembled; done
      - name: gate
        run: |
          echo "6ff7169b30281117a570ec19ea9471e5  assembled" | md5sum -c -
      - name: commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp assembled zeolite.html
          git add zeolite.html
          git commit -m "engine: fix parent-frame replies, hydration media, redirects, parallel fetch, null-body statuses"
          git push origin HEAD:main
      - name: delete branch
        run: |
          BR=${GITHUB_REF#refs/heads/}
          curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/$BR"
