name: rust-wasm
on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-wasm.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rust-wasm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --lib --test diff
      - run: cargo build --release --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v4
        with:
          name: zeolite-parser-wasm
          path: rust/target/wasm32-unknown-unknown/release/zeolite_parser.wasm
      # Commit the built module to the branch so the page build can read it without the artifact API.
      # Lives outside rust/** so this commit does not retrigger the workflow.
      - name: Publish wasm to branch
        if: github.ref_type == 'branch'
        working-directory: .
        run: |
          mkdir -p wasm
          cp rust/target/wasm32-unknown-unknown/release/zeolite_parser.wasm wasm/zeolite_parser.wasm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm/zeolite_parser.wasm
          if git diff --cached --quiet; then echo "wasm unchanged"; exit 0; fi
          git commit -m "Update zeolite_parser.wasm from CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
