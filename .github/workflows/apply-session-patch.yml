name: apply-session-patch
on:
  push:
    paths:
      - 'patches/session.diff'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply-patch
        run: |
          set -e
          cp zeolite.html zeolite-base.html
          patch -p0 --batch < patches/session.diff
          rm -f zeolite-base.html.orig zeolite-engine.html
          mv zeolite-base.html zeolite.html
          echo "d6e9e75ea14397c70ee48ae359de4a40  zeolite.html" | md5sum -c -
          git config user.name "zl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add zeolite.html
          git commit -m "engine: fix blob-origin location leak + on-demand module loading"
          git push
