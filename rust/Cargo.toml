[package]
name = "zeolite-parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_allocator = "=0.156.0"
oxc_ast = "=0.156.0"
oxc_ast_visit = "=0.156.0"
oxc_parser = "=0.156.0"
oxc_span = "=0.156.0"
oxc_syntax = "=0.156.0"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
