name: apply-session-patch
on:
  push:
    paths:
      - 'patches/session.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply-patch
        run: |
          set -e
          cp zeolite.html zeolite-base.html
          patch -p0 --batch < patches/session.txt
          rm -f zeolite-base.html.orig zeolite-engine.html
          mv zeolite-base.html zeolite.html
          echo "a8d3f2bb215449fbe505d5079a9fc080  zeolite.html" | md5sum -c -
          git config user.name "zl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add zeolite.html
          git commit -m "engine: meta refresh attribute-order fix (google.com/ai)"
          git push
